name = "3s-kite-executor"
main = "src/index.js"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

# Create KV namespace: wrangler kv:namespace create KITE_DATA
# Then paste the id below
[[kv_namespaces]]
binding = "KITE_DATA"
id = "REPLACE_WITH_YOUR_KV_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"
